---
title: Miniatures
htmltitle: Printable STL Miniatures from Renegade Minis
permalink: /minis/
---

{% for mini in site.miniatures %}
{% if mini.draft == false %}
    <div class="grid">
        <article>
            {% if mini.fullpage == true %}
              <h3><a href="{{ mini.url }}">{{ mini.title }}</a></h3>
            {% else %}
            <h3>
                {{ mini.title }}
            </h3>
            {% endif %}
            {{ mini.excerpt }}
        </article>
    </div>
{% endif%}
{% endfor %}
